# Publica la web en GitHub Pages en cada push a main.
# Requisito único: Settings → Pages → Source: "GitHub Actions".
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Compilar
        run: npm run build
        env:
          # "/<repo>" en <usuario>.github.io/<repo>/, vacío con dominio propio
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # URL pública completa, para canonical, sitemap y Open Graph
          PAGES_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_TELEMETRY_DISABLED: 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
